name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: cross compile every target
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            out="dist/bastion-${target#bun-}"
            case "$target" in *windows*) out="$out.exe";; esac
            bun build --compile --minify --target="$target" --outfile "$out" warden/src/cli.ts
          done
          cd dist && sha256sum bastion-* > SHA256SUMS
      - name: the compiled binary answers
        run: ./dist/bastion-linux-x64 --version
      - id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: .github/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist/bastion-*
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run --cwd warden build:dist
      - run: node warden/dist/cli.js --version
      - run: npm publish --access public --provenance
        working-directory: core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public --provenance
        working-directory: warden
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@drupflare'
      - name: point both manifests at GitHub Packages
        run: |
          set -euo pipefail
          for dir in core warden; do
            node -e '
              const fs = require("fs");
              const file = process.argv[1] + "/package.json";
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              manifest.publishConfig.registry = "https://npm.pkg.github.com";
              fs.writeFileSync(file, JSON.stringify(manifest, null, "\t") + "\n");
            ' "$dir"
          done
      - run: npm publish --access public
        working-directory: core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm publish --access public
        working-directory: warden
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/drupflare/bastion
            docker.io/drupflare/bastion
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: build for this runner and check the entrypoint
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: bastion:check
      - run: docker run --rm bastion:check --version
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v2
        with:
          body: |
            Container image: `ghcr.io/drupflare/bastion@${{ steps.push.outputs.digest }}`
          append_body: true

  verify:
    needs: [publish, container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: every published target resolves
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 10 ]; then
                echo "still failing after $attempt attempts: $*" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          for package in bastion warden; do
            retry npm view "@drupflare/$package@$version" version \
              --registry https://registry.npmjs.org
            retry npm view "@drupflare/$package@$version" version \
              --registry https://npm.pkg.github.com
          done
          for registry in ghcr.io docker.io; do
            retry docker manifest inspect "$registry/drupflare/bastion:$version"
          done
