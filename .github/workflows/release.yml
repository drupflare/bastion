name: Release

on:
  workflow_dispatch:
    inputs:
      changelog:
        type: string
        description: 'Changelog to replace the auto-generated one'
      suffix:
        type: string
        description: 'Suffix to append to the version'
        default: ''
      skip_npm:
        type: boolean
        description: 'Skip npmjs'
        default: false
      skip_github_npm:
        type: boolean
        description: 'Skip GitHub Packages (npm)'
        default: false
      skip_container:
        type: boolean
        description: 'Skip ghcr.io and Docker Hub'
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Cross Compile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::core/package.json has no version field." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Refuse a Version the Manifests Disagree On
        run: |
          CORE=$(node -p "require('./core/package.json').version")
          WARDEN=$(node -p "require('./warden/package.json').version")
          if [ "$CORE" != "$WARDEN" ]; then
            echo "::error::core says ${CORE} and warden says ${WARDEN}; one release cannot publish two versions." >&2
            exit 1
          fi
      - name: Typecheck
        run: bun run typecheck
      - name: Unit Tests
        run: bun run test
      - name: Reachability
        run: bun run check:reachability
      - name: Cross Compile
        run: |
          set -euo pipefail
          mkdir -p dist/build dist/release
          for TARGET in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            SLUG="${TARGET#bun-}"
            case "$SLUG" in
              windows-*) BIN=bastion.exe ;;
              *) BIN=bastion ;;
            esac
            bun build --compile --minify --target="$TARGET" --outfile "dist/build/${BIN}" warden/src/cli.ts
            case "$SLUG" in
              windows-*)
                (cd dist/build && zip -q "../release/bastion-v${VERSION}-${SLUG}.zip" "$BIN")
                ;;
              *)
                chmod +x "dist/build/${BIN}"
                tar -czf "dist/release/bastion-v${VERSION}-${SLUG}.tar.gz" -C dist/build "$BIN"
                ;;
            esac
            rm -f "dist/build/${BIN}"
          done
          ls -l dist/release
      - name: Verify the Compiled Binary
        run: |
          set -euo pipefail
          tar -xzf "dist/release/bastion-v${VERSION}-linux-x64.tar.gz" -C dist/build
          REPORTED=$(dist/build/bastion --version)
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "::error::the compiled binary reports ${REPORTED} and core/package.json says ${VERSION}." >&2
            exit 1
          fi
          echo "bastion-v${VERSION}-linux-x64 runs and reports ${REPORTED}."
      - name: Checksum the Archives
        run: |
          cd dist/release
          sha256sum bastion-v${VERSION}-* > SHA256SUMS
          cat SHA256SUMS
      - name: Hand the Archives to the Release Job
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/release
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create the Release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract the Version
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          echo "Extracted Version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::core/package.json has no version field; the tag would be 'vundefined'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Retrieve the Latest Tag
        id: latest_tag
        run: |
          echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
      - name: Collect the Archives
        uses: actions/download-artifact@v8
        with:
          name: release-binaries
          path: dist/release
      - name: Build the Changelog
        if: ${{ github.event.inputs.changelog == '' }}
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: '.github/release.json'
          mode: 'HYBRID'
          fromTag: '${{ env.LATEST_TAG }}'
          toTag: '${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          name: bastion v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          body: ${{ steps.changelog.outputs.changelog || github.event.inputs.changelog }}
          files: |
            dist/release/bastion-v${{ env.VERSION }}-*.tar.gz
            dist/release/bastion-v${{ env.VERSION }}-*.zip
            dist/release/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ github.ref_name != 'master' }}

  publish:
    name: Publish Packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Refuse to Publish an Untagged Version
        env:
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          TAG="v${VERSION}${SUFFIX}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} does not exist, so the release job did not create it. Refusing to publish an untagged version." >&2
            exit 1
          fi
          echo "Publishing against ${TAG}."
      - name: Skip a Suffixed Release
        id: suffix
        env:
          SUFFIX: ${{ github.event.inputs.suffix }}
        run: |
          if [ -n "$SUFFIX" ]; then
            echo "Suffix '$SUFFIX' given; core/package.json says ${VERSION}, so npm and the tag would disagree. Skipping the publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Set Up Bun
        if: steps.suffix.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set Up Node for npm
        if: steps.suffix.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install Dependencies
        if: steps.suffix.outputs.skip == 'false'
        run: bun install --frozen-lockfile
      - name: Build the Node Entry Point
        if: steps.suffix.outputs.skip == 'false'
        run: bun run --cwd warden build:dist
      - name: Verify the Node Entry Point
        if: steps.suffix.outputs.skip == 'false'
        run: node warden/dist/cli.js --version
      - name: Publish core to npm
        if: ${{ steps.suffix.outputs.skip == 'false' && github.event.inputs.skip_npm != 'true' }}
        run: npm publish --access public --provenance
        working-directory: core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish warden to npm
        if: ${{ steps.suffix.outputs.skip == 'false' && github.event.inputs.skip_npm != 'true' }}
        run: npm publish --access public --provenance
        working-directory: warden
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Set Up Node for GitHub Packages
        if: ${{ steps.suffix.outputs.skip == 'false' && github.event.inputs.skip_github_npm != 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@drupflare'
      - name: Point Both Manifests at GitHub Packages
        if: ${{ steps.suffix.outputs.skip == 'false' && github.event.inputs.skip_github_npm != 'true' }}
        run: |
          set -euo pipefail
          for dir in core warden; do
            node -e '
              const fs = require("fs");
              const file = process.argv[1] + "/package.json";
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              manifest.publishConfig.registry = "https://npm.pkg.github.com";
              fs.writeFileSync(file, JSON.stringify(manifest, null, "\t") + "\n");
            ' "$dir"
          done
      - name: Publish core to GitHub Packages
        if: ${{ steps.suffix.outputs.skip == 'false' && github.event.inputs.skip_github_npm != 'true' }}
        run: npm publish --access public
        working-directory: core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish warden to GitHub Packages
        if: ${{ steps.suffix.outputs.skip == 'false' && github.event.inputs.skip_github_npm != 'true' }}
        run: npm publish --access public
        working-directory: warden
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Publish Containers
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ github.event.inputs.skip_container != 'true' }}

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Read the Version
        run: |
          VERSION=$(node -p "require('./core/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log In to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive the Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/drupflare/bastion
            docker.io/drupflare/bastion
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ github.ref_name == 'master' }}
      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: bastion:check
      - name: Verify Image
        run: docker run --rm bastion:check --version
      - name: Push Multi-Arch to Both Registries
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record the Image Digest
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}${{ github.event.inputs.suffix }}
          append_body: true
          body: |
            Container image: `ghcr.io/drupflare/bastion@${{ steps.push.outputs.digest }}`

  verify:
    name: Verify Targets
    needs: [publish, container]
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Log In to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve Every Target
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_NPM: ${{ github.event.inputs.skip_npm }}
          SKIP_GITHUB_NPM: ${{ github.event.inputs.skip_github_npm }}
          SKIP_CONTAINER: ${{ github.event.inputs.skip_container }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./core/package.json').version")
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 10 ]; then
                echo "::error::still failing after $attempt attempts: $*" >&2
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 15
            done
          }
          for package in bastion warden; do
            if [ "$SKIP_NPM" != "true" ]; then
              retry npm view "@drupflare/$package@$VERSION" version \
                --registry https://registry.npmjs.org
            fi
            if [ "$SKIP_GITHUB_NPM" != "true" ]; then
              retry npm view "@drupflare/$package@$VERSION" version \
                --registry https://npm.pkg.github.com
            fi
          done
          if [ "$SKIP_CONTAINER" != "true" ]; then
            for registry in ghcr.io docker.io; do
              retry docker manifest inspect "$registry/drupflare/bastion:$VERSION"
            done
          fi
