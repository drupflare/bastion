name: Build

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit Tests
        run: bun run test
      - name: Reachability
        run: bun run check:reachability
      - name: Prettier
        run: bunx prettier --check .

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd dashboard typecheck
      - name: Component Tests
        run: bun run --cwd dashboard test:unit
      - name: Build the SPA
        run: bun run --cwd dashboard build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser Tests
        run: bun run --cwd dashboard test:browser
      - name: Upload the Playwright Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: dashboard/playwright-report
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate the Command Reference
        run: bun run docs:cli
      - name: Fail on Drift
        run: git diff --exit-code -- docs/commands.md MANUAL.md
      - name: Build TypeDoc
        run: bun run docs:api

  siblings:
    name: Sibling Mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: bastion
      - name: Check Out the Worker
        uses: actions/checkout@v7
        with:
          repository: drupflare/worker
          path: worker
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: bastion
      - name: Score the Sibling Mirrors
        run: REQUIRE_SIBLINGS=1 bun run test
        working-directory: bastion

  nightly:
    name: Publish Dev Build to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, dashboard]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Set Up Node for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@drupflare'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Version Both Packages
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./core/package.json').version")
          DEV="${VERSION}-${GITHUB_SHA::7}"
          for dir in core warden; do
            npm pkg set version="$DEV" --prefix "$dir"
            npm pkg set publishConfig.registry=https://npm.pkg.github.com --prefix "$dir"
          done
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          echo "Publishing dev build $DEV" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish core to GitHub Packages
        working-directory: core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public --tag dev
      - name: Publish warden to GitHub Packages
        working-directory: warden
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public --tag dev

  image:
    name: Publish Dev Image to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log In to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive the Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drupflare/bastion
          tags: |
            type=raw,value=dev
            type=sha,format=long
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the Entrypoint
        run: docker run --rm ghcr.io/drupflare/bastion:dev --version
