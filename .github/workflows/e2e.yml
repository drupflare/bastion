name: End-to-End

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Driver Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Start the Dependency Stack
        run: docker compose -f docker/compose.yml up -d --wait redis valkey minio postgres mariadb sshd chromium
      - name: Run the Driver Lane
        run: REQUIRE_DOCKER=1 bun run test:e2e
      - name: Dump the Stack Logs
        run: docker compose -f docker/compose.yml logs
        if: failure()
      - name: Tear the Stack Down
        run: docker compose -f docker/compose.yml down -v
        if: always()

  runtime:
    name: workerd Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Fetch the Pinned Runtime
        run: |
          set -euo pipefail
          PIN=$(bun -e "import {defaultConfig} from './core/src/config/defaults'; console.log(defaultConfig().runtime.workerd.version)")
          echo "bastion pins workerd ${PIN}"
          mkdir -p "$RUNNER_TEMP/runtime"
          npm install --prefix "$RUNNER_TEMP/runtime" --no-save --no-audit --no-fund "workerd@${PIN}"
          BIN="$RUNNER_TEMP/runtime/node_modules/workerd/bin/workerd"
          "$BIN" --version
          echo "WORKERD_BINARY=$BIN" >> "$GITHUB_ENV"
      - name: Compile the Binary
        run: |
          bun run build:binary
          echo "BASTION_BINARY=$PWD/warden/dist/bastion" >> "$GITHUB_ENV"
      - name: Boot workerd From a Generated Config
        run: REQUIRE_WORKERD=1 bun run test:e2e
      - name: Run the Operator Lane
        run: REQUIRE_FLOW=1 bun run test:e2e
      - name: Refuse Rather Than Skip
        run: |
          set -euo pipefail
          if WORKERD_BINARY=/nonexistent/workerd REQUIRE_WORKERD=1 bun run test:e2e; then
            echo "::error::the workerd lane passed with no runtime, so it skipped instead of refusing." >&2
            exit 1
          fi
          echo "the lane refuses a missing runtime rather than reporting success."

  siblings:
    name: Repair Vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Check Out the Worker
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/drupflare/worker.git "$RUNNER_TEMP/worker"
          git -C "$RUNNER_TEMP/worker" sparse-checkout set src/ops
          echo "SIBLING_WORKER=$RUNNER_TEMP/worker" >> "$GITHUB_ENV"
      - name: Score the Vocabulary
        run: REQUIRE_SIBLINGS=1 bun run test:e2e

  serving:
    name: Serving Flow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build the Dashboard
        run: bun run build:dashboard
      - name: Run the Serving Lane
        run: REQUIRE_SERVING=1 bun run test:e2e

  cluster:
    name: Cluster Flow
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run the Cluster Lane
        run: REQUIRE_CLUSTER=1 bun run test:e2e

  payload:
    name: Released Payload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Fetch the Pinned Runtime
        run: |
          set -euo pipefail
          PIN=$(bun -e "import {defaultConfig} from './core/src/config/defaults'; console.log(defaultConfig().runtime.workerd.version)")
          mkdir -p "$RUNNER_TEMP/runtime"
          npm install --prefix "$RUNNER_TEMP/runtime" --no-save --no-audit --no-fund "workerd@${PIN}"
          echo "WORKERD_BINARY=$RUNNER_TEMP/runtime/node_modules/workerd/bin/workerd" >> "$GITHUB_ENV"
      - name: Bundle the Worker
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/drupflare/worker.git "$RUNNER_TEMP/worker"
          cd "$RUNNER_TEMP/worker"
          bun install --frozen-lockfile
          bun run hydrate
          bunx wrangler deploy --dry-run --outdir dist/dry-run
      - name: Assemble the Payload Directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/payload"
          mkdir -p "$DIR"
          cp "$RUNNER_TEMP"/worker/dist/dry-run/site.js "$DIR/"
          cp "$RUNNER_TEMP"/worker/dist/dry-run/*.wasm "$DIR/"
          gh release download --repo drupflare/worker --pattern '*.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/drupflare-worker-*.tar.gz -C "$DIR" assets
          echo "PAYLOAD_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Boot the Payload
        run: REQUIRE_PAYLOAD=1 bun run test:e2e
