name: Integration (E2E)

on:
  push:
    branches: [master, ver/*, feat/*, renovate/*]
  pull_request:
    branches: [master, ver/*, feat/*, renovate/*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Drivers Against Real Servers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Start The Dependency Stack
        run: docker compose -f docker/compose.yml up -d --wait redis valkey minio postgres mariadb sshd
      - name: End-to-End Tests
        run: REQUIRE_DOCKER=1 bun run test:e2e
      - name: Dump The Stack Logs
        run: docker compose -f docker/compose.yml logs
        if: failure()
      - name: Tear The Stack Down
        run: docker compose -f docker/compose.yml down -v
        if: always()
